   name: CI

   on:
     push:
       branches: [ main ]
     pull_request:
       branches: [ main ]

   jobs:
     build-and-test:
       runs-on: ubuntu-latest
       steps:
         - name: Check out code
           uses: actions/checkout@v4

         - name: Set up JDK 21
           uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '21'
             cache: maven

         - name: Build and run tests
           run: mvn -B clean verify

         - name: Upload JAR
           uses: actions/upload-artifact@v4
           with:
             name: food-order-app
             path: target/*.jar