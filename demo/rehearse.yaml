# Laptop-only overrides for rehearsing demo/compose.yaml (the platform ignores ports).
# Use demo/rehearse.sh, which also supplies the secrets from the root .env.
services:
  proxy:
    ports:
      - "8080:80"   # open http://localhost:8080
  backend:
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:8080
