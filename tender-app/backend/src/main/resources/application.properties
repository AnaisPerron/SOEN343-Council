spring.application.name=tenderapp

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Comma-separated origins allowed to call /api/** from a browser (Expo web dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

# How long a login session stays valid (ISO-8601 duration)
app.auth.session-ttl=${SESSION_TTL:PT24H}

#demo data is loaded only when the demo profile is explicitly enabled
spring.sql.init.mode=never

spring.config.import=optional:file:.env[.properties],optional:file:tender-app/backend/.env[.properties]

# Set the maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=900000
spring.datasource.hikari.max-lifetime=9000000

# R-PRC-01: amounts in CAD; distance is straight-line kilometres rounded to 0.01 km.
app.pricing.delivery-fee-per-km=0.80
app.pricing.service-fee=1.50
app.pricing.small-order-threshold=10.00
app.pricing.small-order-surcharge=2.00

# PayPal sandbox credentials remain on the server.
app.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
