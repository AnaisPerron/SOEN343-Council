spring.datasource.url=jdbc:h2:mem:tenderapp-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

app.cors.allowed-origins=http://localhost:8081

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
app.pricing.delivery-fee-per-km=0.80
app.pricing.service-fee=1.50
app.pricing.small-order-threshold=10.00
app.pricing.small-order-surcharge=2.00
